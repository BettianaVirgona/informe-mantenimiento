name: Generar Informe Semanal de Mantenimiento

on:
  schedule:
    # Se ejecuta todos los viernes a las 18:00 UTC (ajustable según horario)
    - cron: '0 18 * * 5'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña "Actions" de GitHub cuando quieras

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Ejecutar script de generación de informe
        run: python app.py
